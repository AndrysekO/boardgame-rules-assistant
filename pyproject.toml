[project]
name = "rules-assistant"
version = "0.1.0"
description = "Board game rules assistant"
readme = "README.md"
authors = [
    { name = "AndrysekO", email = "38909898+AndrysekO@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
